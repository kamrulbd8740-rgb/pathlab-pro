<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathoFlex SaaS - Advanced RBAC Engine</title>
    <!-- Tailwind CSS for modern SaaS UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for live JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <div id="root"></div>

    <script type="text/babel">
        // --- CONSTANT DICTIONARIES ---
        const ROLES = ['ADMIN', 'USER', 'DOCTOR', 'HR', 'PATHOLOGIST'];

        const INITIAL_TEST_LIBRARY = [
            { id: 'T1', name: 'Complete Blood Count (CBC)', cost: 15 },
            { id: 'T2', name: 'Fast Blood Sugar (FBS)', cost: 10 },
            { id: 'T3', name: 'Lipid Profile', cost: 30 },
            { id: 'T4', name: 'Liver Function Test (LFT)', cost: 25 },
            { id: 'T5', name: 'Kidney Function Test (KFT)', cost: 25 }
        ];

        const INITIAL_EMPLOYEES = [
            { id: 'EMP001', name: 'Alice Smith', email: 'alice@company.com', isConfirmed: true, role: 'USER' },
            { id: 'EMP002', name: 'Dr. Bob Jones', email: 'bob@company.com', isConfirmed: true, role: 'DOCTOR' },
            { id: 'EMP003', name: 'Charlie Brown', email: 'charlie@company.com', isConfirmed: false, role: 'USER' },
            { id: 'EMP004', name: 'Helen Ross', email: 'helen@company.com', isConfirmed: true, role: 'HR' },
            { id: 'EMP005', name: 'Pat Kumar', email: 'pat@company.com', isConfirmed: true, role: 'PATHOLOGIST' },
            { id: 'EMP006', name: 'Devon Miller', email: 'admin@company.com', isConfirmed: true, role: 'ADMIN' }
        ];

        const INITIAL_REQUESTS = [
            { 
                id: 'REQ-101', 
                empId: 'EMP001', 
                patientName: 'Alice Smith (Self)', 
                relationship: 'Self',
                tests: [
                    { id: 'T1', name: 'Complete Blood Count (CBC)', approved: true },
                    { id: 'T2', name: 'Fast Blood Sugar (FBS)', approved: true }
                ],
                status: 'COMPLETED', 
                date: '2026-02-14',
                historyLog: ['Requested', 'Doctor Validated', 'HR Approved', 'Pathologist Printed']
            },
            { 
                id: 'REQ-102', 
                empId: 'EMP001', 
                patientName: 'Sarah Smith', 
                relationship: 'Spouse',
                tests: [
                    { id: 'T3', name: 'Lipid Profile', approved: true }
                ],
                status: 'PENDING_HR', 
                date: '2026-05-10',
                historyLog: ['Requested', 'Doctor Validated']
            }
        ];

        function App() {
            // App Global States
            const [employees, setEmployees] = React.useState(INITIAL_EMPLOYEES);
            const [testLibrary, setTestLibrary] = React.useState(INITIAL_TEST_LIBRARY);
            const [requests, setRequests] = React.useState(INITIAL_REQUESTS);
            
            // Security Context: Who is currently logged into the session
            const [sessionUser, setSessionUser] = React.useState(INITIAL_EMPLOYEES[5]); // Default logged in as Devon (Admin)
            
            // Navigation Router State
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [activePrintJob, setActivePrintJob] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            const triggerToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // Dynamic Session Switching Logic
            const handleSessionUserSwitch = (empId) => {
                const user = employees.find(e => e.id === empId);
                if (user) {
                    setSessionUser(user);
                    triggerToast(`Logged in as ${user.name} (${user.role})`);
                }
            };

            // Admin action: Directly alter a target employee's systemic authorization role
            const handleUpdateUserRole = (empId, newRole) => {
                setEmployees(prevEmployees => {
                    const updated = prevEmployees.map(e => e.id === empId ? { ...e, role: newRole } : e);
                    
                    // Critical Synchronicity Lock: If the updated user is the active session user, update the live context immediately
                    const updatedSessionUser = updated.find(e => e.id === sessionUser.id);
                    if (updatedSessionUser) {
                        setSessionUser(updatedSessionUser);
                    }
                    return updated;
                });
                triggerToast(`Role successfully changed to ${newRole}`);
            };

            // Calculation Engine Metrics Helper
            const getEmployeeMetrics = (empId) => {
                const empRequests = requests.filter(r => r.empId === empId);
                const completed = empRequests.filter(r => r.status === 'COMPLETED').length;
                const approved = empRequests.filter(r => r.status === 'PENDING_PATHOLOGIST').length;
                const totalUsed = completed + approved; 
                return {
                    completed,
                    approved,
                    pending: empRequests.filter(r => r.status === 'PENDING_DOC' || r.status === 'PENDING_HR').length,
                    totalUsed,
                    remaining: Math.max(0, 5 - totalUsed)
                };
            };

            const triggerPrint = (request) => {
                setActivePrintJob(request);
                setTimeout(() => { window.print(); }, 3000);
            };

            const handleExportData = (type) => {
                let dataString = "data:text/csv;charset=utf-8,";
                if(type === 'SUMMARY') {
                    dataString += "Employee ID,Name,Role,Tests Used,Remaining Status\n";
                    employees.forEach(e => {
                        const m = getEmployeeMetrics(e.id);
                        dataString += `${e.id},${e.name},${e.role},${m.totalUsed},${m.remaining}\n`;
                    });
                }
                const encodedUri = encodeURI(dataString);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${type}_REPORT.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                triggerToast("Data matrix downloaded.");
            };

            return (
                <div class="min-h-screen flex flex-col justify-between">
                    {toast && (
                        <div class="fixed top-4 right-4 bg-emerald-500 text-slate-950 px-4 py-3 rounded-lg shadow-2xl font-bold z-50">
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* TOP REAL-TIME SECURITY SIMULATOR BAR */}
                    <header class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between no-print gap-4">
                        <div class="flex items-center space-x-3">
                            <div class="bg-indigo-600 p-2 rounded-lg text-white font-black tracking-wider text-sm">🔬 PATHOFLEX SaaS</div>
                            <span class="text-xs font-mono text-emerald-400 bg-emerald-950/50 px-2 py-0.5 border border-emerald-900 rounded">RBAC v2 Engine Active</span>
                        </div>

                        {/* Interactive Session Switcher Mocking Login Environment */}
                        <div class="flex items-center space-x-3 bg-slate-900 p-2 rounded-xl border border-slate-800">
                            <label class="text-xs text-slate-400 uppercase font-bold px-1">Mock Acting Profile:</label>
                            <select 
                                value={sessionUser.id}
                                onChange={(e) => handleSessionUserSwitch(e.target.value)}
                                class="bg-slate-950 border border-slate-700 text-xs text-indigo-400 font-bold p-1.5 rounded-lg focus:outline-none"
                            >
                                {employees.map(emp => (
                                    <option key={emp.id} value={emp.id}>
                                        {emp.name} ({emp.role})
                                    </option>
                                ))}
                            </select>
                        </div>
                    </header>

                    {/* MAIN APPLICATION MODULE SLOTS */}
                    <div class="flex-1 flex flex-col md:flex-row no-print">
                        {/* NAVIGATION LINKS */}
                        <nav class="w-full md:w-64 bg-slate-950 p-4 space-y-1.5 border-r border-slate-800">
                            <p class="text-[10px] font-bold text-slate-500 tracking-wider uppercase px-3">Main Navigation</p>
                            <button onClick={() => setActiveTab('dashboard')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center transition-colors ${activeTab === 'dashboard' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500 font-bold' : 'hover:bg-slate-900 text-slate-400 hover:text-slate-200'}`}>Workspace Central</button>
                            <button onClick={() => setActiveTab('requests')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center transition-colors ${activeTab === 'requests' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500 font-bold' : 'hover:bg-slate-900 text-slate-400 hover:text-slate-200'}`}>Diagnostic Registry Pipeline</button>
                            
                            {/* RBAC Gate - Admin Section Visibility */}
                            {sessionUser.role === 'ADMIN' && (
                                <>
                                    <p class="text-[10px] font-bold text-slate-500 tracking-wider uppercase px-3 pt-6">Root Authority Control</p>
                                    <button onClick={() => setActiveTab('employees')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center transition-colors ${activeTab === 'employees' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500 font-bold' : 'hover:bg-slate-900 text-slate-400 hover:text-slate-200'}`}>Manage Personnel & Roles</button>
                                    <button onClick={() => setActiveTab('library')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center transition-colors ${activeTab === 'library' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500 font-bold' : 'hover:bg-slate-900 text-slate-400 hover:text-slate-200'}`}>Pathology Directory</button>
                                </>
                            )}
                        </nav>

                        {/* CONTROLLER CONTENT AREA ROUTER */}
                        <main class="flex-1 p-6 overflow-y-auto max-w-7xl mx-auto w-full">
                            {activeTab === 'dashboard' && <DashboardView requests={requests} sessionUser={sessionUser} getEmployeeMetrics={getEmployeeMetrics} handleExportData={handleExportData} />}
                            {activeTab === 'requests' && <RequestsView requests={requests} setRequests={setRequests} testLibrary={testLibrary} sessionUser={sessionUser} getEmployeeMetrics={getEmployeeMetrics} triggerPrint={triggerPrint} triggerToast={triggerToast} />}
                            {activeTab === 'employees' && sessionUser.role === 'ADMIN' && <EmployeesView employees={employees} setEmployees={setEmployees} handleUpdateUserRole={handleUpdateUserRole} getEmployeeMetrics={getEmployeeMetrics} triggerToast={triggerToast} />}
                            {activeTab === 'library' && sessionUser.role === 'ADMIN' && <LibraryView testLibrary={testLibrary} setTestLibrary={setTestLibrary} triggerToast={triggerToast} />}
                        </main>
                    </div>

                    {/* INVISIBLE SYSTEM PRINT LAYER VIEWPORT */}
                    <div id="print-area" class="hidden print:block p-8 text-slate-950 bg-white min-h-screen">
                        {activePrintJob && (
                            <div>
                                <h1 class="text-xl font-black border-b-2 border-slate-900 pb-2 mb-4 uppercase tracking-tight">PATHOFLEX WORK ORDER SLIP</h1>
                                <p class="text-xs mb-4"><strong>Tracking Code ID:</strong> {activePrintJob.id} | <strong>Date Issued:</strong> {activePrintJob.date}</p>
                                <div class="mb-4 text-xs">
                                    <p><strong>Patient File:</strong> {activePrintJob.patientName} ({activePrintJob.relationship})</p>
                                    <p><strong>Filing Corporate Account Node:</strong> {activePrintJob.empId}</p>
                                </div>
                                <table class="w-full text-left text-xs border-collapse border border-slate-300">
                                    <thead>
                                        <tr class="bg-slate-100 border-b border-slate-300">
                                            <th class="p-2">Assay Code</th>
                                            <th class="p-2">Diagnostic Test Description</th>
                                            <th class="p-2 text-right">Status Flag</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {activePrintJob.tests.map((t, idx) => (
                                            <tr key={idx} class="border-b border-slate-200">
                                                <td class="p-2 font-mono">{t.id}</td>
                                                <td class="p-2 font-medium">{t.name}</td>
                                                <td class="p-2 text-right font-bold">{t.approved ? "AUTHORIZED" : "REJECTED"}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    <footer class="bg-slate-950 border-t border-slate-800 px-6 py-3 text-center text-xs text-slate-500 no-print">
                        <p>Production Framework Stack Sandbox Engine. Secure Role-Based Access Enforcement Modules.</p>
                    </footer>
                </div>
            );
        }

        // --- VIEW COMPONENT 1: DASHBOARD ---
        function DashboardView({ requests, sessionUser, getEmployeeMetrics, handleExportData }) {
            const metrics = getEmployeeMetrics(sessionUser.id);
            
            // Dynamic Enforcement Rule 2: Non-admins are completely isolated to seeing only their personal data row rows
            const visibleRequests = sessionUser.role === 'ADMIN' 
                ? requests 
                : requests.filter(r => r.empId === sessionUser.id || (sessionUser.role === 'DOCTOR' && r.status === 'PENDING_DOC') || (sessionUser.role === 'HR' && r.status === 'PENDING_HR') || (sessionUser.role === 'PATHOLOGIST' && r.status === 'PENDING_PATHOLOGIST'));

            return (
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight">Workspace Dashboard</h2>
                            <p class="text-sm text-slate-400">Current systemic workspace visibility acting as: <span class="text-indigo-400 font-bold font-mono">{sessionUser.role}</span></p>
                        </div>
                        <button onClick={() => handleExportData('SUMMARY')} class="bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs font-bold px-3 py-2 rounded-xl">📥 Download Summary Report</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Your Personal Allocations Used</p>
                            <p class="text-2xl font-extrabold text-indigo-400 mt-1">{metrics.totalUsed} <span class="text-xs font-normal text-slate-500">/ 5 tests</span></p>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Remaining Free Assays Scope</p>
                            <p class="text-2xl font-extrabold text-emerald-400 mt-1">{metrics.remaining}</p>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Verified Corporate Status Rank</p>
                            <p class="text-base font-bold text-slate-200 mt-2">{sessionUser.isConfirmed ? "✅ Confirmed Profile Status" : "❌ Non-Confirmed Lock"}</p>
                        </div>
                    </div>

                    <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                        <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 text-xs font-bold uppercase text-slate-400 tracking-wider">
                            Authorized Pipeline Stream Data
                        </div>
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-900/40 text-xs text-slate-400 border-b border-slate-800">
                                    <th class="p-3">ID</th>
                                    <th class="p-3">Patient Legal Identity</th>
                                    <th class="p-3">Relation</th>
                                    <th class="p-3">Status State Machine</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                {visibleRequests.map(r => (
                                    <tr key={r.id} class="hover:bg-slate-900/40">
                                        <td class="p-3 font-mono text-xs font-bold text-indigo-400">{r.id}</td>
                                        <td class="p-3 font-medium">{r.patientName}</td>
                                        <td class="p-3 text-xs text-slate-400">{r.relationship}</td>
                                        <td class="p-3">
                                            <span class="text-[10px] font-mono font-bold tracking-widest uppercase bg-slate-900 px-2 py-0.5 rounded border border-slate-800 text-amber-400">{r.status}</span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- VIEW COMPONENT 2: TEST REQUEST PIPELINE ---
        function RequestsView({ requests, setRequests, testLibrary, sessionUser, getEmployeeMetrics, triggerPrint, triggerToast }) {
            const [isOpen, setIsOpen] = React.useState(false);
            const [patientName, setPatientName] = React.useState('');
            const [relation, setRelation] = React.useState('Self');
            const [selectedTests, setSelectedTests] = React.useState([]);
            const [hrPreviewData, setHrPreviewData] = React.useState(null);

            const handleToggleCheckbox = (id) => {
                setSelectedTests(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            const handleSubmitRequest = (e) => {
                e.preventDefault();
                if(!sessionUser.isConfirmed) return alert("Operation Blocked: Account Profile Not Confirmed.");
                if(getEmployeeMetrics(sessionUser.id).totalUsed >= 5) return alert("System Rule Block: Max Annual Allocation Consumed.");

                const newObj = {
                    id: `REQ-${Math.floor(1000 + Math.random()*9000)}`,
                    empId: sessionUser.id,
                    patientName: relation === 'Self' ? `${sessionUser.name} (Self)` : patientName,
                    relationship: relation,
                    tests: selectedTests.map(id => ({ id, name: testLibrary.find(t=>t.id===id).name, approved: true })),
                    status: 'PENDING_DOC',
                    date: new Date().toISOString().split('T')[0],
                    historyLog: ['Filed Into Core Engine']
                };

                setRequests([newObj, ...requests]);
                setIsOpen(false);
                setSelectedTests([]);
                setPatientName('');
                triggerToast("Diagnostic transaction filed successfully!");
            };

            const mutateTestCheckboxState = (reqId, testId) => {
                setRequests(prev => prev.map(r => r.id === reqId ? {
                    ...r, tests: r.tests.map(t => t.id === testId ? { ...t, approved: !t.approved } : t)
                } : r));
            };

            const advanceState = (id, next, log) => {
                setRequests(prev => prev.map(r => r.id === id ? { ...r, status: next, historyLog: [...r.historyLog, log] } : r));
                triggerToast("Pipeline processing step updated.");
            };

            const visibleRequests = sessionUser.role === 'ADMIN' 
                ? requests 
                : requests.filter(r => r.empId === sessionUser.id || (sessionUser.role === 'DOCTOR' && r.status === 'PENDING_DOC') || (sessionUser.role === 'HR' && r.status === 'PENDING_HR') || (sessionUser.role === 'PATHOLOGIST' && r.status === 'PENDING_PATHOLOGIST'));

            return (
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight">Diagnostic Registry Pipeline</h2>
                            <p class="text-sm text-slate-400">Process and validate healthcare allocations.</p>
                        </div>
                        {/* Users, Doctors, and Pathologists can file requests using their base employee profiles */}
                        {sessionUser.isConfirmed && (
                            <button onClick={() => setIsOpen(true)} class="bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-4 py-2.5 rounded-xl transition-all shadow-lg">➕ Open Diagnostic Order File</button>
                        )}
                    </div>

                    {isOpen && (
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <form onSubmit={handleSubmitRequest} class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4">
                                <h3 class="font-bold text-sm tracking-tight text-slate-200">New Pathology Diagnostic Entry filing</h3>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1">Target Profile Relationship Node</label>
                                    <select value={relation} onChange={(e)=>setRelation(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs focus:outline-none focus:border-indigo-500">
                                        <option value="Self">Self (Primary Staff Profile File)</option>
                                        <option value="Spouse">Spouse</option>
                                        <option value="Parents">Parent File</option>
                                        <option value="Children">Child File</option>
                                    </select>
                                </div>
                                {relation !== 'Self' && (
                                    <div>
                                        <label class="block text-xs font-bold text-slate-400 mb-1">Dependent Legal Full Name</label>
                                        <input type="text" required value={patientName} onChange={(e)=>setPatientName(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs focus:outline-none" />
                                    </div>
                                )}
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1">Select Laboratory Assays</label>
                                    <div class="bg-slate-950 border border-slate-800 rounded-lg p-2 max-h-32 overflow-y-auto space-y-1">
                                        {testLibrary.map(t => (
                                            <label key={t.id} class="flex items-center space-x-2 text-xs text-slate-300">
                                                <input type="checkbox" checked={selectedTests.includes(t.id)} onChange={()=>handleToggleCheckbox(t.id)} class="rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0" />
                                                <span>{t.name}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                                <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                                    <button type="button" onClick={()=>setIsOpen(false)} class="bg-slate-800 px-3 py-1.5 rounded-lg text-xs">Close</button>
                                    <button type="submit" class="bg-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold text-white">Inject Request Order</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {hrPreviewData && (
                        <div class="bg-indigo-950/40 border border-indigo-500/30 p-4 rounded-xl relative space-y-2">
                            <button onClick={()=>setHrPreviewData(null)} class="absolute top-2 right-3 text-xs text-indigo-400 font-bold hover:text-white">✕ Close Preview</button>
                            <h4 class="text-xs font-bold uppercase tracking-widest text-indigo-400">⚡ HR Metrics Quick Look Pipeline Preview Module</h4>
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-center text-xs">
                                <div class="bg-slate-950 p-2 rounded-lg"><p class="text-[10px] text-slate-400">Completed</p><p class="font-bold">{hrPreviewData.completed}</p></div>
                                <div class="bg-slate-950 p-2 rounded-lg"><p class="text-[10px] text-slate-400">Approved</p><p class="font-bold">{hrPreviewData.approved}</p></div>
                                <div class="bg-slate-950 p-2 rounded-lg"><p class="text-[10px] text-slate-400">Pending</p><p class="font-bold">{hrPreviewData.pending}</p></div>
                                <div class="bg-slate-950 p-2 rounded-lg"><p class="text-[10px] text-slate-400">Total Structural Allocation</p><p class="font-bold text-amber-400">{hrPreviewData.totalUsed} / 5</p></div>
                                <div class="bg-slate-950 p-2 rounded-lg"><p class="text-[10px] text-slate-400">Remaining Slots</p><p class="font-bold text-emerald-400">{hrPreviewData.remaining}</p></div>
                            </div>
                        </div>
                    )}

                    <div class="space-y-4">
                        {visibleRequests.map(req => {
                            const m = getEmployeeMetrics(req.empId);
                            const canMutate = (sessionUser.role === 'DOCTOR' && req.status === 'PENDING_DOC') || (sessionUser.role === 'PATHOLOGIST' && req.status === 'PENDING_PATHOLOGIST') || sessionUser.role === 'ADMIN';
                            return (
                                <div key={req.id} class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col space-y-3">
                                    <div class="flex items-start justify-between border-b border-slate-900 pb-2">
                                        <div>
                                            <p class="text-xs font-mono font-bold text-indigo-400">{req.id} <span class="text-slate-600 font-sans font-normal">• Profile link: {req.empId}</span></p>
                                            <h4 class="font-bold text-sm text-slate-200 mt-0.5">{req.patientName} <span class="text-[10px] bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800 text-slate-400 ml-1 font-sans">{req.relationship}</span></h4>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            {sessionUser.role === 'HR' && (
                                                <button onClick={()=>setHrPreviewData(m)} class="bg-indigo-900/30 text-indigo-400 border border-indigo-900 px-2 py-0.5 rounded text-[11px] font-bold">🔍 Fast Audit Look</button>
                                            )}
                                            <span class="text-[10px] font-mono font-black tracking-widest uppercase bg-slate-900 px-2 py-1 rounded text-amber-500 border border-slate-800">{req.status}</span>
                                        </div>
                                    </div>

                                    {/* CLUSTER MATRIX INTERACTIVE CHECKBOX FIELD */}
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 bg-slate-900/40 p-3 rounded-lg border border-slate-900">
                                        {req.tests.map(t => (
                                            <label key={t.id} class={`flex items-center space-x-2 text-xs p-1 rounded ${canMutate ? 'cursor-pointer hover:bg-slate-900' : ''}`}>
                                                <input type="checkbox" disabled={!canMutate} checked={t.approved} onChange={()=>mutateTestCheckboxState(req.id, t.id)} class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0" />
                                                <span class={t.approved ? 'text-slate-200' : 'text-slate-500 line-through'}>{t.name}</span>
                                            </label>
                                        ))}
                                    </div>

                                    <div class="flex items-center justify-between pt-2 text-xs">
                                        <span class="text-[11px] text-slate-500 truncate max-w-xs">Track: {req.historyLog[req.historyLog.length-1]}</span>
                                        <div class="flex space-x-2">
                                            {sessionUser.role === 'DOCTOR' && req.status === 'PENDING_DOC' && (
                                                <button onClick={()=>advanceState(req.id, 'PENDING_HR', 'Doctor Validated Workflow')} class="bg-indigo-600 text-white font-bold px-2.5 py-1 rounded-md text-xs">Sign off Clinical Approval</button>
                                            )}
                                            {sessionUser.role === 'HR' && req.status === 'PENDING_HR' && (
                                                <button disabled={m.totalUsed >= 5} onClick={()=>advanceState(req.id, 'PENDING_PATHOLOGIST', 'HR Budget Verification Approved')} class="bg-emerald-600 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold px-2.5 py-1 rounded-md text-xs">
                                                    {m.totalUsed >= 5 ? "⚠️ Limit Lock Out" : "Confirm Budget & Allocation"}
                                                </button>
                                            )}
                                            {sessionUser.role === 'ADMIN' && req.status === 'PENDING_HR' && m.totalUsed >= 5 && (
                                                <button onClick={()=>advanceState(req.id, 'PENDING_PATHOLOGIST', 'Admin Budget Allocation Force Override')} class="bg-amber-600 text-white font-bold px-2.5 py-1 rounded-md text-xs">⚡ Admin Force Bypass Override</button>
                                            )}
                                            {(sessionUser.role === 'PATHOLOGIST' || sessionUser.role === 'ADMIN') && (
                                                <button onClick={()=>triggerPrint(req)} class="bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-1 rounded-md text-xs">🖨️ Print Slip Layout</button>
                                            )}
                                            {sessionUser.role === 'PATHOLOGIST' && req.status === 'PENDING_PATHOLOGIST' && (
                                                <button onClick={()=>advanceState(req.id, 'COMPLETED', 'Pathology laboratory analysis logged complete')} class="bg-indigo-600 text-white font-bold px-2.5 py-1 rounded-md text-xs">Complete Lab Process</button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // --- VIEW COMPONENT 3: PERSONNEL & ROLE CONFIGURE SUITE ---
        function EmployeesView({ employees, setEmployees, handleUpdateUserRole, getEmployeeMetrics, triggerToast }) {
            const [bulkInput, setBulkInput] = React.useState('');
            const [openUpload, setOpenUpload] = React.useState(false);

            const handleBulkProcess = (e) => {
                e.preventDefault();
                const lines = bulkInput.trim().split('\n');
                const parsed = [];
                lines.forEach(line => {
                    const cols = line.split(',');
                    if(cols.length >= 4) {
                        parsed.push({
                            id: cols[0].trim(), name: cols[1].trim(), email: cols[2].trim(),
                            isConfirmed: cols[3].trim().toLowerCase() === 'true', role: (cols[4] || 'USER').trim().toUpperCase()
                        });
                    }
                });
                if(parsed.length > 0) {
                    setEmployees([...employees, ...parsed]);
                    setBulkInput('');
                    setOpenUpload(false);
                    triggerToast(`Successfully loaded ${parsed.length} employees into local application instance state.`);
                }
            };

            return (
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight">Corporate Personnel Directory</h2>
                            <p class="text-sm text-slate-400">Configure corporate verification rules and define granular user roles.</p>
                        </div>
                        <button onClick={()=>setOpenUpload(!openUpload)} class="bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-3 py-2 rounded-xl">📂 Bulk Upload Plaintext Template</button>
                    </div>

                    {openUpload && (
                        <form onSubmit={handleBulkProcess} class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3 animate-fade-in">
                            <p class="text-xs font-mono text-slate-400">Format: EMP_ID,Name,Email,IsConfirmed(true/false),Role(ADMIN/USER/DOCTOR/HR/PATHOLOGIST)</p>
                            <textarea value={bulkInput} onChange={(e)=>setBulkInput(e.target.value)} rows="3" placeholder="EMP999,Jane Doe,jane@corp.com,true,USER" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 font-mono text-xs focus:outline-none focus:border-indigo-500" />
                            <div class="flex justify-end space-x-2"><button type="submit" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Inject Process Array</button></div>
                        </form>
                    )}

                    <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-900/60 border-b border-slate-800 text-xs text-slate-400 font-bold">
                                    <th class="p-3">Staff ID</th>
                                    <th class="p-3">Full Legal Name</th>
                                    <th class="p-3">Email Address</th>
                                    <th class="p-3">Security Access Role Assignment</th>
                                    <th class="p-3 text-center">Status Allocation Verification Lock</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                {employees.map(emp => (
                                    <tr key={emp.id} class="hover:bg-slate-900/30">
                                        <td class="p-3 font-mono text-xs font-bold text-indigo-400">{emp.id}</td>
                                        <td class="p-3 font-medium text-slate-200">{emp.name}</td>
                                        <td class="p-3 text-xs text-slate-400 font-mono">{emp.email}</td>
                                        
                                        {/* - CRITICAL USER TASK INTERACTIVE UPGRADE: ADMIN DEFINED ROLE COMPONENT DIRECT SELECTOR SLOT - */}
                                        <td class="p-3">
                                            <select 
                                                value={emp.role} 
                                                onChange={(e) => handleUpdateUserRole(emp.id, e.target.value)}
                                                class="bg-slate-900 border border-slate-700 rounded p-1 text-xs font-mono font-bold text-indigo-400 focus:outline-none focus:border-indigo-500 cursor-pointer"
                                            >
                                                {ROLES.map(roleOpt => (
                                                    <option key={roleOpt} value={roleOpt}>{roleOpt}</option>
                                                ))}
                                            </select>
                                        </td>

                                        <td class="p-3 text-center">
                                            <button 
                                                onClick={() => setEmployees(employees.map(e => e.id === emp.id ? { ...e, isConfirmed: !e.isConfirmed } : e))}
                                                class={`text-xs px-2.5 py-0.5 rounded-full font-bold border ${emp.isConfirmed ? 'bg-emerald-950/40 text-emerald-400 border-emerald-900' : 'bg-rose-950/40 text-rose-400 border-rose-900'}`}
                                            >
                                                {emp.isConfirmed ? "Confirmed Staff File" : "Non-Confirmed Block"}
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- VIEW COMPONENT 4: TEST DIRECTORY ---
        function LibraryView({ testLibrary, setTestLibrary, triggerToast }) {
            const [name, setName] = React.useState('');
            const [cost, setCost] = React.useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                setTestLibrary([...testLibrary, { id: `T${testLibrary.length+1}`, name, cost: parseFloat(cost) }]);
                setName(''); setCost('');
                triggerToast("New test profile added to library configuration directory state.");
            };

            return (
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <form onSubmit={handleAdd} class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3 h-fit">
                        <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400">Add New Lab Assay Configuration</h3>
                        <div><label class="block text-xs text-slate-400 font-bold mb-1">Name</label><input type="text" required value={name} onChange={(e)=>setName(e.target.value)} class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs focus:outline-none" /></div>
                        <div><label class="block text-xs text-slate-400 font-bold mb-1">Cost Base Standard ($)</label><input type="number" required value={cost} onChange={(e)=>setCost(e.target.value)} class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs focus:outline-none" /></div>
                        <button type="submit" class="w-full bg-indigo-600 font-bold text-xs text-white py-2 rounded-lg">Save Definition Node</button>
                    </form>
                    <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden lg:col-span-2">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-900/60 border-b border-slate-800 text-xs text-slate-400"><th class="p-3">Assay ID</th><th class="p-3">Diagnostic Label Description</th><th class="p-3 text-right">Standard Rate Valuation</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                {testLibrary.map(t => (
                                    <tr key={t.id} class="hover:bg-slate-900/20"><td class="p-3 font-mono text-xs text-indigo-400 font-bold">{t.id}</td><td class="p-3 font-medium">{t.name}</td><td class="p-3 text-right font-mono text-xs text-slate-300">${t.cost} USD</td></tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
