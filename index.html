<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathoFlex - Corporate Wellness SaaS</title>
    <!-- Tailwind CSS for sleek UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons for SaaS Vibe -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <div id="root"></div>

    <script type="text/babel">
        // --- SEED DATA / DATABASE STRUCTURE ---
        const INITIAL_TEST_LIBRARY = [
            { id: 'T1', name: 'Complete Blood Count (CBC)', cost: 15 },
            { id: 'T2', name: 'Fast Blood Sugar (FBS)', cost: 10 },
            { id: 'T3', name: 'Lipid Profile', cost: 30 },
            { id: 'T4', name: 'Liver Function Test (LFT)', cost: 25 },
            { id: 'T5', name: 'Kidney Function Test (KFT)', cost: 25 },
            { id: 'T6', name: 'Thyroid Panel (T3, T4, TSH)', cost: 35 }
        ];

        const INITIAL_EMPLOYEES = [
            { id: 'EMP001', name: 'Alice Smith', email: 'alice@company.com', isConfirmed: true, role: 'USER' },
            { id: 'EMP002', name: 'Dr. Bob Jones', email: 'bob@company.com', isConfirmed: true, role: 'DOCTOR' },
            { id: 'EMP003', name: 'Charlie Brown', email: 'charlie@company.com', isConfirmed: false, role: 'USER' },
            { id: 'EMP004', name: 'Helen Ross', email: 'helen@company.com', isConfirmed: true, role: 'HR' },
            { id: 'EMP005', name: 'Pat Kumar', email: 'pat@company.com', isConfirmed: true, role: 'PATHOLOGIST' },
            { id: 'EMP006', name: 'Devon Miller', email: 'admin@company.com', isConfirmed: true, role: 'ADMIN' }
        ];

        const INITIAL_REQUESTS = [
            { 
                id: 'REQ-101', 
                empId: 'EMP001', 
                patientName: 'Alice Smith (Self)', 
                relationship: 'Self',
                tests: [
                    { id: 'T1', name: 'Complete Blood Count (CBC)', approved: true },
                    { id: 'T2', name: 'Fast Blood Sugar (FBS)', approved: true }
                ],
                status: 'COMPLETED', 
                date: '2026-02-14',
                historyLog: ['Requested', 'Doctor Validated', 'HR Approved', 'Pathologist Printed']
            },
            { 
                id: 'REQ-102', 
                empId: 'EMP001', 
                patientName: 'Sarah Smith', 
                relationship: 'Spouse',
                tests: [
                    { id: 'T3', name: 'Lipid Profile', approved: true }
                ],
                status: 'PENDING_HR', 
                date: '2026-05-10',
                historyLog: ['Requested', 'Doctor Validated']
            }
        ];

        function App() {
            // App Core States
            const [currentRole, setCurrentRole] = React.useState('ADMIN');
            const [currentUser, setCurrentUser] = React.useState(INITIAL_EMPLOYEES[5]); // Default Admin
            const [employees, setEmployees] = React.useState(INITIAL_EMPLOYEES);
            const [testLibrary, setTestLibrary] = React.useState(INITIAL_TEST_LIBRARY);
            const [requests, setRequests] = React.useState(INITIAL_REQUESTS);
            
            // UI Navigation State
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            // Print Target Modal State
            const [activePrintJob, setActivePrintJob] = React.useState(null);

            // Notification Feedback State
            const [toast, setToast] = React.useState(null);
            const triggerToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // Handle Role Swapping Mirror Logic
            const handleRoleChange = (roleName) => {
                setCurrentRole(roleName);
                const matchedUser = employees.find(e => e.role === roleName) || employees[0];
                setCurrentUser(matchedUser);
                triggerToast(`Switched workspace context to ${roleName}`);
            };

            // Business Rule Helper: Get usage metrics for any employee
            const getEmployeeMetrics = (empId) => {
                const empRequests = requests.filter(r => r.empId === empId);
                const completed = empRequests.filter(r => r.status === 'COMPLETED').length;
                const approved = empRequests.filter(r => r.status === 'PENDING_PATHOLOGIST').length;
                const pending = empRequests.filter(r => r.status === 'PENDING_DOC' || r.status === 'PENDING_HR').length;
                const totalUsed = completed + approved; // Total structural deductions
                return {
                    completed,
                    approved,
                    pending,
                    totalUsed,
                    remaining: Math.max(0, 5 - totalUsed)
                };
            };

            // Global Print Trigger
            const triggerPrint = (request) => {
                setActivePrintJob(request);
                setTimeout(() => {
                    window.print();
                }, 500);
            };

            // Mock Data Bulk Export (CSV/Excel simulator)
            const handleExportData = (type) => {
                let dataString = "data:text/csv;charset=utf-8,";
                if(type === 'SUMMARY') {
                    dataString += "Employee ID,Name,Tests Used,Remaining Status\n";
                    employees.forEach(e => {
                        const m = getEmployeeMetrics(e.id);
                        dataString += `${e.id},${e.name},${m.totalUsed},${m.remaining}\n`;
                    });
                } else {
                    dataString += "Request ID,Patient,Relationship,Status,Date\n";
                    requests.forEach(r => {
                        dataString += `${r.id},${r.patientName},${r.relationship},${r.status},${r.date}\n`;
                    });
                }
                const encodedUri = encodeURI(dataString);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${type}_REPORT_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                triggerToast("Report exported successfully!");
            };

            return (
                <div class="min-h-screen flex flex-col justify-between">
                    {/* Top Alert System Notification Bar */}
                    {toast && (
                        <div class="fixed top-4 right-4 bg-emerald-500 text-slate-950 px-4 py-3 rounded-lg shadow-2xl font-bold flex items-center space-x-2 z-50 animate-bounce">
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* TOP NAVBAR */}
                    <header class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between no-print">
                        <div class="flex items-center space-x-3">
                            <div class="bg-indigo-600 p-2 rounded-lg text-white font-black tracking-wider">🔬 PATHOFLEX</div>
                            <span class="text-xs text-slate-400 font-mono">v1.0.0-Beta44</span>
                        </div>

                        {/* Fast Prototyping Context Switcher */}
                        <div class="flex items-center space-x-4 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                            <span class="text-xs font-semibold uppercase text-slate-400 px-2">Vibe Role:</span>
                            {['ADMIN', 'USER', 'DOCTOR', 'HR', 'PATHOLOGIST'].map((role) => (
                                <button
                                    key={role}
                                    onClick={() => handleRoleChange(role)}
                                    class={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${
                                        currentRole === role 
                                        ? 'bg-indigo-500 text-white shadow-md' 
                                        : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    {role}
                                </button>
                            ))}
                        </div>

                        <div class="text-right hidden md:block">
                            <p class="text-xs font-bold text-slate-300">{currentUser.name}</p>
                            <span class="text-[10px] font-mono bg-slate-800 text-indigo-400 px-1.5 py-0.5 rounded uppercase">{currentRole} Context</span>
                        </div>
                    </header>

                    {/* MAIN APPLICATION WORKSPACE */}
                    <div class="flex-1 flex flex-col md:flex-row no-print">
                        {/* SIDEBAR NAVIGATION */}
                        <nav class="w-full md:w-64 bg-slate-950 p-4 space-y-2 border-r border-slate-800">
                            <p class="text-[10px] font-bold text-slate-500 tracking-wider uppercase px-3">Views</p>
                            <button onClick={() => setActiveTab('dashboard')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center space-x-2 transition-colors ${activeTab === 'dashboard' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500' : 'hover:bg-slate-900 text-slate-300'}`}>Dashboard</button>
                            <button onClick={() => setActiveTab('requests')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center space-x-2 transition-colors ${activeTab === 'requests' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500' : 'hover:bg-slate-900 text-slate-300'}`}>Test Requests</button>
                            
                            {currentRole === 'ADMIN' && (
                                <>
                                    <p class="text-[10px] font-bold text-slate-500 tracking-wider uppercase px-3 pt-4">Admin Suite</p>
                                    <button onClick={() => setActiveTab('employees')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center space-x-2 transition-colors ${activeTab === 'employees' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500' : 'hover:bg-slate-900 text-slate-300'}`}>Manage Employees</button>
                                    <button onClick={() => setActiveTab('library')} class={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center space-x-2 transition-colors ${activeTab === 'library' ? 'bg-indigo-600/20 text-indigo-400 border-l-2 border-indigo-500' : 'hover:bg-slate-900 text-slate-300'}`}>Test Directory</button>
                                </>
                            )}
                        </nav>

                        {/* ROUTER CONTENT CONTROLLER */}
                        <main class="flex-1 p-6 overflow-y-auto max-w-7xl mx-auto w-full">
                            {activeTab === 'dashboard' && <DashboardView requests={requests} employees={employees} currentUser={currentUser} currentRole={currentRole} getEmployeeMetrics={getEmployeeMetrics} handleExportData={handleExportData} />}
                            {activeTab === 'requests' && <RequestsView requests={requests} setRequests={setRequests} testLibrary={testLibrary} currentUser={currentUser} currentRole={currentRole} getEmployeeMetrics={getEmployeeMetrics} triggerPrint={triggerPrint} triggerToast={triggerToast} />}
                            {activeTab === 'employees' && currentRole === 'ADMIN' && <EmployeesView employees={employees} setEmployees={setEmployees} getEmployeeMetrics={getEmployeeMetrics} triggerToast={triggerToast} />}
                            {activeTab === 'library' && currentRole === 'ADMIN' && <LibraryView testLibrary={testLibrary} setTestLibrary={setTestLibrary} triggerToast={triggerToast} />}
                        </main>
                    </div>

                    {/* --- INVISIBLE PRINT LAYER (Triggered via system UI mechanics) --- */}
                    <div id="print-area" class="hidden print:block p-8 text-slate-950 bg-white min-h-screen">
                        {activePrintJob && (
                            <div>
                                <div class="border-b-2 border-slate-900 pb-4 mb-6 flex justify-between items-center">
                                    <div>
                                        <h1 class="text-2xl font-black uppercase tracking-tight">PATHOFLEX DISPATCH</h1>
                                        <p class="text-sm">Corporate Medical Diagnostic Authorization Slip</p>
                                    </div>
                                    <div class="text-right font-mono text-xs">
                                        <p><strong>Slip Token:</strong> {activePrintJob.id}</p>
                                        <p><strong>Date Generated:</strong> {activePrintJob.date}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4 mb-6 text-sm">
                                    <div>
                                        <h3 class="font-bold uppercase text-slate-600 text-xs">Patient Details</h3>
                                        <p class="text-base font-bold">{activePrintJob.patientName}</p>
                                        <p>Relation Framework: <span class="font-semibold">{activePrintJob.relationship}</span></p>
                                    </div>
                                    <div>
                                        <h3 class="font-bold uppercase text-slate-600 text-xs">Authorization Profile</h3>
                                        <p>Corporate Acc ID: {activePrintJob.empId}</p>
                                        <p>Current Status: <span class="font-bold tracking-wider">{activePrintJob.status}</span></p>
                                    </div>
                                </div>
                                <div class="mb-8">
                                    <h3 class="font-bold uppercase text-slate-600 text-xs mb-2">Prescribed Clinical Assays</h3>
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="border-b border-slate-300 text-xs bg-slate-100">
                                                <th class="p-2">Assay Code</th>
                                                <th class="p-2">Description / Name</th>
                                                <th class="p-2 text-right">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {activePrintJob.tests.map((t, idx) => (
                                                <tr key={idx} class="border-b border-slate-200 text-sm">
                                                    <td class="p-2 font-mono">{t.id}</td>
                                                    <td class="p-2 font-medium">{t.name}</td>
                                                    <td class="p-2 text-right font-bold text-xs">{t.approved ? "APPROVED/ACTIVE" : "EXCLUDED/REJECTED"}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div class="mt-16 flex justify-between pt-8 border-t border-dashed border-slate-400 text-center text-xs">
                                    <div>
                                        <div class="w-40 border-b border-slate-900 mx-auto mb-1"></div>
                                        <p>Authorized Medical Officer</p>
                                    </div>
                                    <div>
                                        <div class="w-40 border-b border-slate-900 mx-auto mb-1"></div>
                                        <p>Corporate HR Verification</p>
                                    </div>
                                    <div>
                                        <div class="w-40 border-b border-slate-900 mx-auto mb-1"></div>
                                        <p>Pathology Unit Reciever</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* VIBE CODER FOOTER */}
                    <footer class="bg-slate-950 border-t border-slate-800 px-6 py-3 text-center text-xs text-slate-500 no-print flex flex-col md:flex-row justify-between items-center gap-2">
                        <p>Built with ⚡ React, Tailwind & Pure Polish. Single-File Production Sandbox.</p>
                        <div class="flex space-x-4">
                            <span class="hover:text-slate-300 cursor-pointer">API Webhook Spec</span>
                            <span class="hover:text-slate-300 cursor-pointer">Base44 Engine Docs</span>
                        </div>
                    </footer>
                </div>
            );
        }

        // --- DASHBOARD ROUTE VIEW ---
        function DashboardView({ requests, employees, currentUser, currentRole, getEmployeeMetrics, handleExportData }) {
            const metrics = getEmployeeMetrics(currentUser.id);
            const systemTotalRequests = requests.length;
            const systemPendingHR = requests.filter(r => r.status === 'PENDING_HR').length;
            const systemPendingDoc = requests.filter(r => r.status === 'PENDING_DOC').length;

            // Security Filtering Logic: Non-Admins ONLY see their own rows
            const visibleRequests = currentRole === 'ADMIN' 
                ? requests 
                : requests.filter(r => r.empId === currentUser.id || (currentRole === 'DOCTOR' && r.status === 'PENDING_DOC') || (currentRole === 'HR' && r.status === 'PENDING_HR') || (currentRole === 'PATHOLOGIST' && r.status === 'PENDING_PATHOLOGIST'));

            return (
                <div class="space-y-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight">Workspace Central</h2>
                            <p class="text-sm text-slate-400">Real-time status metrics and authorization pipelines.</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onClick={() => handleExportData('SUMMARY')} class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-3 py-2 rounded-lg border border-slate-700 flex items-center space-x-1">📥 Export Metrics CSV</button>
                            <button onClick={() => handleExportData('REQUESTS')} class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-3 py-2 rounded-lg border border-slate-700 flex items-center space-x-1">📥 Export Audit Logs</button>
                        </div>
                    </div>

                    {/* METRIC CARD GRID ARCHITECTURE */}
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Personal Entitlements Used</p>
                            <p class="text-3xl font-extrabold text-indigo-400 mt-1">{metrics.totalUsed} <span class="text-sm font-normal text-slate-500">/ 5</span></p>
                            <p class="text-[11px] text-slate-400 mt-1">Based on Approved/Active orders</p>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Remaining Safe Requests</p>
                            <p class="text-3xl font-extrabold text-emerald-400 mt-1">{metrics.remaining}</p>
                            <p class="text-[11px] text-slate-400 mt-1">Autoblock protection threshold</p>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pipeline Queue (Global)</p>
                            <p class="text-3xl font-extrabold text-amber-400 mt-1">{systemPendingDoc + systemPendingHR}</p>
                            <p class="text-[11px] text-slate-400 mt-1">{systemPendingDoc} Doc / {systemPendingHR} HR Pending</p>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Corporate Verification Rank</p>
                            <p class="text-lg font-bold text-slate-200 mt-2 truncate">{currentUser.isConfirmed ? "✅ Confirmed Staff" : "❌ Unconfirmed Status"}</p>
                            <p class="text-[11px] text-slate-500">Facility locks if unconfirmed</p>
                        </div>
                    </div>

                    {/* LIVE VIEW FEED/TABLE */}
                    <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                        <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Authorized Data Feed Window</h3>
                            <span class="text-[10px] font-mono text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded">Showing {visibleRequests.length} relative nodes</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b border-slate-800 text-xs text-slate-400 bg-slate-900/50">
                                        <th class="p-3">Req ID</th>
                                        <th class="p-3">Patient Name</th>
                                        <th class="p-3">Relation</th>
                                        <th class="p-3">Date Ordered</th>
                                        <th class="p-3">Status Pipeline</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800">
                                    {visibleRequests.map((r) => (
                                        <tr key={r.id} class="hover:bg-slate-900/60 transition-colors">
                                            <td class="p-3 font-mono font-bold text-xs text-indigo-400">{r.id}</td>
                                            <td class="p-3 font-medium text-slate-200">{r.patientName}</td>
                                            <td class="p-3"><span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">{r.relationship}</span></td>
                                            <td class="p-3 text-xs text-slate-400">{r.date}</td>
                                            <td class="p-3">
                                                <span class={`text-[10px] font-bold tracking-wider px-2 py-1 rounded uppercase ${
                                                    r.status === 'COMPLETED' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                                    r.status === 'PENDING_DOC' ? 'bg-indigo-950 text-indigo-400 border border-indigo-800' :
                                                    r.status === 'PENDING_HR' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                                                    'bg-purple-950 text-purple-400 border border-purple-800'
                                                }`}>
                                                    {r.status}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                    {visibleRequests.length === 0 && (
                                        <tr>
                                            <td colSpan="5" class="p-8 text-center text-slate-500 italic text-xs">No records tracked under this identity footprint.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // --- REQUESTS ROUTE VIEW (The Operations Engine) ---
        function RequestsView({ requests, setRequests, testLibrary, currentUser, currentRole, getEmployeeMetrics, triggerPrint, triggerToast }) {
            // New Form States
            const [isNewModalOpen, setIsNewModalOpen] = React.useState(false);
            const [patientName, setPatientName] = React.useState('');
            const [relationship, setRelationship] = React.useState('Self');
            const [selectedTests, setSelectedTests] = React.useState([]);

            // Quick Preview Engine for HR
            const [previewMetrics, setPreviewMetrics] = React.useState(null);

            const handleToggleTestSelection = (testId) => {
                if(selectedTests.includes(testId)) {
                    setSelectedTests(selectedTests.filter(id => id !== testId));
                } else {
                    setSelectedTests([...selectedTests, testId]);
                }
            };

            // Rule Framework Check: Verification status + Counter Hard Limit
            const handleCreateRequest = (e) => {
                e.preventDefault();

                if (!currentUser.isConfirmed) {
                    alert("OPERATION BLOCKED: Only Confirmed Corporate Staff Can Avail Medical Allocations.");
                    return;
                }

                const currentUsage = getEmployeeMetrics(currentUser.id);
                if (currentUsage.totalUsed >= 5) {
                    alert("AUTO NEW TEST REQUEST RESTRICTION TRIGGERED: You have completely used your 5 free diagnostic tests for the annual billing cycle.");
                    return;
                }

                if (selectedTests.length === 0) {
                    alert("Please select at least one clinical assay test.");
                    return;
                }

                const newRequestObj = {
                    id: `REQ-${Math.floor(1000 + Math.random() * 9000)}`,
                    empId: currentUser.id,
                    patientName: relationship === 'Self' ? `${currentUser.name} (Self)` : patientName,
                    relationship,
                    tests: selectedTests.map(id => {
                        const libItem = testLibrary.find(t => t.id === id);
                        return { id: libItem.id, name: libItem.name, approved: true };
                    }),
                    status: 'PENDING_DOC', // Auto-forwards directly to Doctor validation
                    date: new Date().toISOString().split('T')[0],
                    historyLog: ['Requested by User']
                };

                setRequests([newRequestObj, ...requests]);
                setIsNewModalOpen(false);
                // Clear Form Fields
                setPatientName('');
                setRelationship('Self');
                setSelectedTests([]);
                triggerToast("Diagnostic entry request saved to the pipeline!");
            };

            // Doctor Checkbox Mutation Engine
            const toggleTestApprovalByDoctorOrPathologist = (requestId, testId) => {
                setRequests(requests.map(req => {
                    if (req.id === requestId) {
                        const updatedTests = req.tests.map(t => t.id === testId ? { ...t, approved: !t.approved } : t);
                        return { ...req, tests: updatedTests };
                    }
                    return req;
                }));
            };

            // Pipeline Stage State Machine Transitions
            const advancePipelineStage = (reqId, currentStage, action) => {
                setRequests(requests.map(req => {
                    if (req.id === reqId) {
                        let nextStatus = req.status;
                        let logEntry = '';

                        if (currentStage === 'PENDING_DOC') {
                            if (action === 'APPROVE') {
                                nextStatus = 'PENDING_HR';
                                logEntry = 'Validated & Approved by Clinical Doctor';
                            } else {
                                nextStatus = 'REJECTED_BY_DOC';
                                logEntry = 'Rejected by Doctor';
                            }
                        } else if (currentStage === 'PENDING_HR') {
                            const employeeUsage = getEmployeeMetrics(req.empId);
                            
                            if (action === 'APPROVE') {
                                // Double safeguard limit validation check inside HR processing loop
                                if (employeeUsage.totalUsed >= 5 && currentRole !== 'ADMIN') {
                                    alert("CRITICAL SECURITY VIOLATION: Usage footprint exceeds maximum allowed threshold. Only Root Administrators can manually bypass and approve this request override.");
                                    return req;
                                }
                                nextStatus = 'PENDING_PATHOLOGIST';
                                logEntry = 'HR Budget Allocation Confirmed';
                            } else {
                                nextStatus = 'REJECTED_BY_HR';
                                logEntry = 'HR Budget Allocation Denied';
                            }
                        } else if (currentStage === 'PENDING_PATHOLOGIST') {
                            if (action === 'COMPLETE') {
                                nextStatus = 'COMPLETED';
                                logEntry = 'Assay Work Completed & Closed by Lab Technician';
                            }
                        }

                        return {
                            ...req,
                            status: nextStatus,
                            historyLog: [...req.historyLog, logEntry]
                        };
                    }
                    return req;
                }));
                triggerToast(`Request state updated smoothly.`);
            };

            // Filter views based on permission rules
            const visibleRequests = currentRole === 'ADMIN' 
                ? requests 
                : requests.filter(r => r.empId === currentUser.id || (currentRole === 'DOCTOR' && r.status === 'PENDING_DOC') || (currentRole === 'HR' && r.status === 'PENDING_HR') || (currentRole === 'PATHOLOGIST' && r.status === 'PENDING_PATHOLOGIST'));

            return (
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight">Diagnostic Pipeline Registry</h2>
                            <p class="text-sm text-slate-400">Process, manage, validate and issue operational diagnostic workflows.</p>
                        </div>
                        
                        {/* Only Allow Users / Doctors / Pathologists who are executing user actions to raise requests */}
                        {currentUser.isConfirmed && (
                            <button 
                                onClick={() => {
                                    const metrics = getEmployeeMetrics(currentUser.id);
                                    if(metrics.totalUsed >= 5) {
                                        alert("AUTO BLOCKED: Your account usage metrics state you have already consumed your full 5 time allowance limit.");
                                    } else {
                                        setIsNewModalOpen(true);
                                    }
                                }} 
                                class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition-all shadow-lg"
                            >
                                ➕ File New Request Request
                            </button>
                        )}
                    </div>

                    {/* MODAL WINDOW FOR NEW FILING */}
                    {isNewModalOpen && (
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
                                <div class="px-6 py-4 bg-slate-950 border-b border-slate-800 flex justify-between items-center">
                                    <h3 class="font-bold text-base">New Diagnostics Application Filing</h3>
                                    <button onClick={() => setIsNewModalOpen(false)} class="text-slate-400 hover:text-white text-xs">✕ Close</button>
                                </div>
                                <form onSubmit={handleCreateRequest} class="p-6 space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Relationship Framework</label>
                                        <select 
                                            value={relationship} 
                                            onChange={(e) => setRelationship(e.target.value)}
                                            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                                        >
                                            <option value="Self">Self (Primary Employee Profile)</option>
                                            <option value="Spouse">Spouse</option>
                                            <option value="Parents">Parent</option>
                                            <option value="Children">Child</option>
                                        </select>
                                    </div>

                                    {relationship !== 'Self' && (
                                        <div>
                                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Dependent Family Member Name</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={patientName}
                                                onChange={(e) => setPatientName(e.target.value)}
                                                placeholder="Enter Full Legal Name"
                                                class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>
                                    )}

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1.5">Select Targeted Pathology Tests (Select Multiselect Checkbox Cluster)</label>
                                        <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 max-h-48 overflow-y-auto space-y-2">
                                            {testLibrary.map(t => (
                                                <label key={t.id} class="flex items-center space-x-3 text-xs text-slate-300 cursor-pointer hover:text-white">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={selectedTests.includes(t.id)}
                                                        onChange={() => handleToggleTestSelection(t.id)}
                                                        class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0 focus:ring-offset-0"
                                                    />
                                                    <span>{t.name}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <div class="pt-4 border-t border-slate-800 flex justify-end space-x-2">
                                        <button type="button" onClick={() => setIsNewModalOpen(false)} class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-lg">Cancel</button>
                                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-4 py-2 rounded-lg text-white">Submit Into Network Pipeline</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* HR QUICK PREVIEW CARD DRAWER */}
                    {previewMetrics && (
                        <div class="bg-indigo-950/40 border border-indigo-500/30 rounded-xl p-4 relative animate-fade-in">
                            <button onClick={() => setPreviewMetrics(null)} class="absolute top-2 right-3 text-indigo-400 hover:text-white text-xs font-bold">✕ Close Preview</button>
                            <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-2">⚡ HR Context Fast Audit Preview Tracker</h4>
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
                                <div class="bg-slate-950/60 p-2 rounded-lg"><p class="text-[10px] text-slate-400 uppercase">Completed</p><p class="text-lg font-bold text-slate-200">{previewMetrics.completed}</p></div>
                                <div class="bg-slate-950/60 p-2 rounded-lg"><p class="text-[10px] text-slate-400 uppercase">Approved Queue</p><p class="text-lg font-bold text-slate-200">{previewMetrics.approved}</p></div>
                                <div class="bg-slate-950/60 p-2 rounded-lg"><p class="text-[10px] text-slate-400 uppercase">Pending Review</p><p class="text-lg font-bold text-slate-200">{previewMetrics.pending}</p></div>
                                <div class="bg-slate-950/60 p-2 rounded-lg"><p class="text-[10px] text-slate-400 uppercase">Total Allocated Deductions</p><p class="text-lg font-bold text-amber-400">{previewMetrics.totalUsed} / 5</p></div>
                                <div class="bg-slate-950/60 p-2 rounded-lg"><p class="text-[10px] text-slate-400 uppercase">Remaining Scope</p><p class="text-lg font-bold text-emerald-400">{previewMetrics.remaining}</p></div>
                            </div>
                        </div>
                    )}

                    {/* INTERACTIVE WORKFLOW REGISTRY CARD COMPONENT LOOP */}
                    <div class="space-y-4">
                        {visibleRequests.map((req) => {
                            const metrics = getEmployeeMetrics(req.empId);
                            return (
                                <div key={req.id} class="bg-slate-950 border border-slate-800 rounded-xl p-5 shadow-md flex flex-col space-y-4">
                                    <div class="flex flex-wrap items-start justify-between gap-2 border-b border-slate-900 pb-3">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-xs font-mono font-bold text-indigo-400">{req.id}</span>
                                                <span class="text-slate-600">•</span>
                                                <h3 class="font-bold text-sm text-slate-100">{req.patientName}</h3>
                                                <span class="text-[10px] bg-slate-900 px-1.5 py-0.5 rounded text-slate-400">{req.relationship}</span>
                                            </div>
                                            <p class="text-xs text-slate-500 mt-0.5">Filing Employee ID Link: <span class="font-mono text-slate-400">{req.empId}</span> | Date: {req.date}</p>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            {currentRole === 'HR' && (
                                                <button 
                                                    onClick={() => setPreviewMetrics(metrics)}
                                                    class="bg-indigo-900/40 text-indigo-400 border border-indigo-800/40 hover:bg-indigo-900 text-[11px] font-bold px-2.5 py-1 rounded"
                                                >
                                                    🔍 Quick Audit Look
                                                </button>
                                            )}
                                            <span class={`text-[10px] font-bold tracking-widest uppercase px-2.5 py-1 rounded-md ${
                                                req.status === 'COMPLETED' ? 'bg-emerald-950 text-emerald-400' :
                                                req.status === 'PENDING_DOC' ? 'bg-indigo-950 text-indigo-400' :
                                                req.status === 'PENDING_HR' ? 'bg-amber-950 text-amber-400' :
                                                'bg-purple-950 text-purple-400'
                                            }`}>
                                                {req.status}
                                            </span>
                                        </div>
                                    </div>

                                    {/* INNER TESTS CHECKBOX LOOP MATRIX */}
                                    <div>
                                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Targeted Diagnostic Assay Profiles Checkbox Cluster</p>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 bg-slate-900/50 p-3 rounded-lg border border-slate-900">
                                            {req.tests.map((test) => {
                                                const canMutate = (currentRole === 'DOCTOR' && req.status === 'PENDING_DOC') || (currentRole === 'PATHOLOGIST' && req.status === 'PENDING_PATHOLOGIST') || currentRole === 'ADMIN';
                                                return (
                                                    <label key={test.id} class={`flex items-center space-x-3 text-xs p-1.5 rounded transition-colors ${canMutate ? 'cursor-pointer hover:bg-slate-900' : ''}`}>
                                                        <input 
                                                            type="checkbox"
                                                            disabled={!canMutate}
                                                            checked={test.approved}
                                                            onChange={() => toggleTestApprovalByDoctorOrPathologist(req.id, test.id)}
                                                            class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0 focus:ring-offset-0 disabled:opacity-60"
                                                        />
                                                        <span class={`font-medium ${test.approved ? 'text-slate-200' : 'text-slate-500 line-through'}`}>{test.name}</span>
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* CONTEXTUAL ACTION DRIVERS LAYER */}
                                    <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-900/60">
                                        <div class="text-[11px] text-slate-500 max-w-md truncate">
                                            <strong>Audit Track:</strong> {req.historyLog[req.historyLog.length - 1]}
                                        </div>

                                        <div class="flex items-center space-x-2">
                                            {/* Doctor Action Set */}
                                            {currentRole === 'DOCTOR' && req.status === 'PENDING_DOC' && (
                                                <>
                                                    <button onClick={() => advancePipelineStage(req.id, 'PENDING_DOC', 'REJECT')} class="bg-rose-950 text-rose-400 hover:bg-rose-900 text-xs font-bold px-3 py-1.5 rounded-lg border border-rose-900">Deny Medical Validation</button>
                                                    <button onClick={() => advancePipelineStage(req.id, 'PENDING_DOC', 'APPROVE')} class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Validate & Sign Request</button>
                                                </>
                                            )}

                                            {/* HR Action Set */}
                                            {currentRole === 'HR' && req.status === 'PENDING_HR' && (
                                                <>
                                                    <button onClick={() => advancePipelineStage(req.id, 'PENDING_HR', 'REJECT')} class="bg-rose-950 text-rose-400 hover:bg-rose-900 text-xs font-bold px-3 py-1.5 rounded-lg border border-rose-900">Deny Request Allocation</button>
                                                    <button 
                                                        onClick={() => advancePipelineStage(req.id, 'PENDING_HR', 'APPROVE')} 
                                                        disabled={metrics.totalUsed >= 5}
                                                        class={`text-xs font-bold px-3 py-1.5 rounded-lg ${metrics.totalUsed >= 5 ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}
                                                    >
                                                        {metrics.totalUsed >= 5 ? "⚠️ Limit Hit (Locked for Admin Override Only)" : "Confirm Budget & Pass"}
                                                    </button>
                                                </>
                                            )}

                                            {/* Admin Override Escape Hatch for HR Blocked States */}
                                            {currentRole === 'ADMIN' && req.status === 'PENDING_HR' && metrics.totalUsed >= 5 && (
                                                <button onClick={() => advancePipelineStage(req.id, 'PENDING_HR', 'APPROVE')} class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">⚡ Root Admin Force Approve Override</button>
                                            )}

                                            {/* Pathologist Action Set */}
                                            {(currentRole === 'PATHOLOGIST' || currentRole === 'ADMIN') && (
                                                <button onClick={() => triggerPrint(req)} class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 flex items-center space-x-1">🖨️ Print Slip Paperwork</button>
                                            )}
                                            {currentRole === 'PATHOLOGIST' && req.status === 'PENDING_PATHOLOGIST' && (
                                                <button onClick={() => advancePipelineStage(req.id, 'PENDING_PATHOLOGIST', 'COMPLETE')} class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">✅ Complete Assay Logging</button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        {visibleRequests.length === 0 && (
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-12 text-center text-slate-500 italic text-sm">No action queue requirements tracked for your current role workspace layout.</div>
                        )}
                    </div>
                </div>
            );
        }

        // --- EMPLOYEES ROUTE VIEW ---
        function EmployeesView({ employees, setEmployees, getEmployeeMetrics, triggerToast }) {
            const [showBulkTemplate, setShowBulkTemplate] = React.useState(false);
            const [bulkInputText, setBulkInputText] = React.useState('');

            const handleToggleStatus = (empId) => {
                setEmployees(employees.map(e => e.id === empId ? { ...e, isConfirmed: !e.isConfirmed } : e));
                triggerToast("User account verification status mutated.");
            };

            const handleProcessBulkUpload = (e) => {
                e.preventDefault();
                if(!bulkInputText.trim()) return;

                const lines = bulkInputText.trim().split('\n');
                const newEmployeesParsed = [];

                lines.forEach(line => {
                    const columns = line.split(',');
                    if (columns.length >= 4) {
                        newEmployeesParsed.push({
                            id: columns[0].trim(),
                            name: columns[1].trim(),
                            email: columns[2].trim(),
                            isConfirmed: columns[3].trim().toLowerCase() === 'true',
                            role: (columns[4] || 'USER').trim().toUpperCase()
                        });
                    }
                });

                if(newEmployeesParsed.length > 0) {
                    setEmployees([...employees, ...newEmployeesParsed]);
                    setBulkInputText('');
                    setShowBulkTemplate(false);
                    triggerToast(`Successfully loaded ${newEmployeesParsed.length} new employees into memory runtime stack!`);
                } else {
                    alert("Parsing Error. Please strictly verify your string formatting matches the schema matrix rule layout.");
                }
            };

            return (
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight">Corporate Personnel Directory</h2>
                            <p class="text-sm text-slate-400">Configure core workforce attributes and toggle framework rules permissions.</p>
                        </div>
                        <button onClick={() => setShowBulkTemplate(!showBulkTemplate)} class="bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-3 py-2 rounded-xl transition-all shadow-md">📂 CSV Bulk Upload Tool</button>
                    </div>

                    {/* BULK DATA SHEET PARSING DRAWER */}
                    {showBulkTemplate && (
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-4 animate-fade-in">
                            <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                                <p class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-1">📋 Comma-Separated Values (CSV) Schema Matrix Reference Format:</p>
                                <code class="text-[11px] font-mono block text-slate-400 select-all">
                                    EMP101,John Doe,john@corp.com,true,USER<br/>
                                    EMP102,Jane Roe,jane@corp.com,false,DOCTOR
                                </code>
                            </div>
                            <form onSubmit={handleProcessBulkUpload} class="space-y-3">
                                <textarea 
                                    rows="4"
                                    value={bulkInputText}
                                    onChange={(e) => setBulkInputText(e.target.value)}
                                    placeholder="Paste clean plaintext dataset data matrix rows here..."
                                    class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 font-mono text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                                />
                                <div class="flex justify-end space-x-2">
                                    <button type="button" onClick={() => setShowBulkTemplate(false)} class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg">Cancel</button>
                                    <button type="submit" class="text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg font-bold text-white">Execute Inject Process Array</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* PERSONNEL CONTROL TABLE SHEET */}
                    <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="border-b border-slate-800 text-xs text-slate-400 bg-slate-900/50">
                                    <th class="p-3">Staff ID</th>
                                    <th class="p-3">Full Legal Name</th>
                                    <th class="p-3">Email Network Address</th>
                                    <th class="p-3">Default System Authority Role Token</th>
                                    <th class="p-3 text-center">Facility Status Verification Lock</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                {employees.map(e => {
                                    const usage = getEmployeeMetrics(e.id);
                                    return (
                                        <tr key={e.id} class="hover:bg-slate-900/40 transition-colors">
                                            <td class="p-3 font-mono text-xs text-indigo-400 font-bold">{e.id}</td>
                                            <td class="p-3 font-medium text-slate-200">{e.name}</td>
                                            <td class="p-3 text-xs text-slate-400 font-mono">{e.email}</td>
                                            <td class="p-3"><span class="text-[10px] bg-slate-900 text-indigo-400 font-mono border border-indigo-950 px-2 py-0.5 rounded">{e.role}</span></td>
                                            <td class="p-3 text-center">
                                                <button 
                                                    onClick={() => handleToggleStatus(e.id)}
                                                    class={`text-xs px-3 py-1 rounded-full font-semibold transition-all ${e.isConfirmed ? 'bg-emerald-950 text-emerald-400 border border-emerald-900' : 'bg-rose-950 text-rose-400 border border-rose-900'}`}
                                                >
                                                    {e.isConfirmed ? "Confirmed Staff (Unlocked)" : "Unconfirmed (Blocked)"}
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- DIAGNOSTICS DIRECTORY VIEW ---
        function LibraryView({ testLibrary, setTestLibrary, triggerToast }) {
            const [newTestName, setNewTestName] = React.useState('');
            const [newTestCost, setNewTestCost] = React.useState('');

            const handleAddTestItem = (e) => {
                e.preventDefault();
                if(!newTestName.trim() || !newTestCost) return;

                const newAssay = {
                    id: `T${testLibrary.length + 1}`,
                    name: newTestName.trim(),
                    cost: parseFloat(newTestCost)
                };

                setTestLibrary([...testLibrary, newAssay]);
                setNewTestName('');
                setNewTestCost('');
                triggerToast(`Added ${newAssay.name} to the core directory!`);
            };

            return (
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold tracking-tight">Clinical Diagnostic Catalog</h2>
                        <p class="text-sm text-slate-400">Manage and expand the global library catalog of allowable pathology tests.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                        {/* LEFT FORM TO ADD ITEMS */}
                        <form onSubmit={handleAddTestItem} class="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-4">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Add New Lab Assay Definition</h3>
                            <div>
                                <label class="block text-xs text-slate-400 font-bold mb-1">Diagnostic Assay Name</label>
                                <input 
                                    type="text" 
                                    required
                                    value={newTestName}
                                    onChange={(e) => setNewTestName(e.target.value)}
                                    placeholder="e.g., Vitamin D3 Hydroxy"
                                    class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                                />
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 font-bold mb-1">Estimated Value Base Units Cost ($)</label>
                                <input 
                                    type="number" 
                                    required
                                    value={newTestCost}
                                    onChange={(e) => setNewTestCost(e.target.value)}
                                    placeholder="35"
                                    class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                                />
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white py-2 rounded-lg transition-all shadow-md">💾 Save Entry Definition</button>
                        </form>

                        {/* RIGHT DATA SHEET VIEW */}
                        <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden lg:col-span-2">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b border-slate-800 text-xs text-slate-400 bg-slate-900/50">
                                        <th class="p-3">Assay Code</th>
                                        <th class="p-3">Test Classification Name</th>
                                        <th class="p-3 text-right">Corporate Unit Base Cost</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800">
                                    {testLibrary.map(t => (
                                        <tr key={t.id} class="hover:bg-slate-900/40 transition-colors">
                                            <td class="p-3 font-mono text-xs text-indigo-400 font-bold">{t.id}</td>
                                            <td class="p-3 font-medium text-slate-200">{t.name}</td>
                                            <td class="p-3 text-right font-mono text-xs text-slate-300">${t.cost} USD</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // --- APP ENGINE BOOT INITIALIZATION ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
